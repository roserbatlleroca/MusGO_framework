####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: MG²
    link: https://awesome-mmgen.github.io/
    year: 2024
    license: MIT License
    description: A lightweight melody-guided text-to-music model. Melody information is incorporated implicitly within the CLMP and explicitly in the retrieval augmented diffusion module.  # 1-3 sentence summary of what the model does and how it works
    apptype: Text-to-music, Melody-to-music         # specify the application type of the model (see suggestions above)
    architecture: Diffusion     # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org: 
    name: Guangxi University, China and Southwestern University of Finance and Economics, China
    link: https://www.gxu.edu.cn/en/
    notes:

# MusGO evaluation

# [1] System source code
sourcecode:
    class: open
    link: https://github.com/shaopengw/Awesome-Music-Generation
    notes: Source code is available on GitHub, including data processing, model architecture, training and fine-tuning, and inference scripts.  

# [2] Training data
trainingdata:
    class: open
    link: https://huggingface.co/datasets/ManzhenWei/MG2-Dataset
    notes: "This model was trained on about 132 hours from two open datasets: MusicCaps and MusicBench, which are detailed in Hugging Face."

# [3] Model weights
modelweights:
    class: open
    link: https://huggingface.co/ManzhenWei/MG2/tree/main
    notes: Checkpoints are available on Hugging Face. 

# [4] Code documentation 
codedoc:
    class: open
    link: https://github.com/shaopengw/Awesome-Music-Generation/blob/main/README.md
    notes: Source code is well-documented, including environment setup,data processing, training and fine-tuning procedure, as well as quick start instructions.  

# [5] Training procedure
trainprocedure:
    class: open
    link: https://arxiv.org/pdf/2409.20196
    notes: Training procedure is fully described in the research paper (see Section 5.3). Code documentation provides additional instructions on how the model might be retrained or fine-tuned. 

# [6] Evaluation procedure
evalprocedure:
    class: open
    link: https://arxiv.org/pdf/2409.20196
    notes: Evaluation procedure is fully described in the research paper (see Section 5.4). Evaluation data is 1/10 of MusicCaps and MusicBench. Testing splits are properly identified in the dataset card. In addition, a human evaluation was conducted to assess recognizability, text relevance, satisfaction, quality and market potential of generated samples (see Section 6). These samples are shared in their complementary website. 

# [7] Research paper
paper:
    class: partial
    link: https://arxiv.org/abs/2409.20196
    notes: Research paper is available on arXiv, but it has not yet been peer-reviewed. 
    date: September 2024

# [8] Licensing
license:
    class: open
    link: https://github.com/shaopengw/Awesome-Music-Generation?tab=MIT-1-ov-file
    notes: The project is licensed under the MIT License.

# [9] Model card
modelcard:
    class: star
    link: https://huggingface.co/ManzhenWei/MG2
    notes: A model card is available on Hugging Face. 

# [10] Datasheet
datasheet:
    class: star
    link: https://huggingface.co/datasets/ManzhenWei/MG2-Dataset
    notes: A dataset card is provided on Hugging Face. 

# [11] Package
package:
    class: ∅
    link:
    notes:

# [12] User-oriented application
ux:
    class: ∅
    link: https://mg2.vip.cpolar.cn/
    notes: An online-based user-oriented application should be available in the indicated link. However, it is not currently accessible.

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://awesome-mmgen.github.io/
    notes: An official project website showcases sonified audio samples generated by MG² alongside comparative baselines (AudioLDM2, Mustango).
