####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# # If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: Magenta RealTime 
    link: https://magenta.withgoogle.com/magenta-realtime
    year: 2025
    license: Apache 2.0 License 
    description: High-quality real-time music synthesis with low-latency real-time controls via MIDI, text, and audio.   # 1-3 sentence summary of what the model does and how it works
    apptype: MIDI-to-audio, Text-to-music       # specify the application type of the model (see suggestions above)
    architecture: Autoregressive transformer    # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
    name: Google Magenta
    link: https://magenta.withgoogle.com/
    notes:

# MusGO evaluation

# [1] System source code
sourcecode:
    class: partial
    link: https://github.com/magenta/magenta-realtime/tree/main
    notes: The codebase is available on GitHub, including model architecture, and inference code. However, the training code is not publicly available.

# [2] Training data
trainingdata:
    class: closed
    link: https://arxiv.org/pdf/2508.04651
    notes: Technical report indicates the model has been trained on ~190,000 hours of instrumental stock music. But there is no clear description of the datasets or specifc sources used for training. 

# [3] Model weights
modelweights:
    class: open
    link: https://huggingface.co/google/magenta-realtime-2/tree/main/checkpoints
    notes: Model weights are available on Hugging Face. 
 
# [4] Code documentation 
codedoc:
    class: open
    link: https://github.com/magenta/magenta-realtime/tree/main?tab=readme-ov-file#
    notes: Model code is well documented in the GitHub repository, including installation requirements, usage instructions, and examples. 

# [5] Training procedure
trainprocedure:
    class: open
    link: https://arxiv.org/abs/2508.04651
    notes: Training procedure is documented in the technical report, including hardware requirements and model configurations.

# [6] Evaluation procedure
evalprocedure:
    class: open
    link: https://arxiv.org/abs/2508.04651
    notes: Evaluation procedure is documented in the technical report, including evaluation metrics and results. Magenta Realtime is compared against two other music genrative models (Stable Audio Open and MusicGen) using the Song Describer dataset. 

# [7] Research paper
paper:
    class: partial
    link: https://arxiv.org/abs/2508.04651
    notes: A comprehensive technical report is available. No peer-reviewed publication has been published yet. 
    date: 6 August, 2025

# [8] Licensing
license:
    class: open
    link: https://github.com/magenta/magenta-realtime/tree/main?tab=Apache-2.0-1-ov-file#
    notes: The code in this repository is released under Apache 2.0 License. The models weights in this repository are released under the CC-BY-NC 4.0 license.

# [9] Model card
modelcard:
    class: star
    link: https://huggingface.co/google/magenta-realtime-2
    notes: Model card is available on Hugging Face. 

# [10] Datasheet
datasheet:
    class: ∅
    link:
    notes:

# [11] Package
package:
    class: star
    link: https://github.com/magenta/magenta-realtime/blob/main/README.md
    notes: Magenta Realtime is available as a Python package, installable via PyPI (`magenta-rt`). 

# [12] User-oriented application
ux:
    class: star
    link: https://colab.research.google.com/github/magenta/magenta-realtime/blob/v1_legacy/notebooks/Magenta_RT_Demo.ipynb
    notes: There is a demo notebook available on Google Colab, which allows users to interact with the model in real-time.

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://magenta.withgoogle.com/magenta-realtime
    notes: There is a dedicated blog and supplementary page featuring listening examples, demonstrations, and explanations of the core architecture.

