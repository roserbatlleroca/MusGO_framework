####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# # If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: RAVE
    link: https://github.com/acids-ircam/RAVE
    year: 2021
    license: CC BY-NC 4.0 License.
    description: Fast and high-quality audio waveform synthesizer.    # 1-3 sentence summary of what the model does and how it works
    apptype: Audio synthesis, Style transfer     # specify the application type of the model (see suggestions above)
    architecture: VAE      # specify the architecture type of the model (see suggestions above)
    notes:           # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
  name: IRCAM
  link: https://www.ircam.fr/
  notes:

# MusGO evaluation

# [1] Open Source Code
sourcecode:
  class: open
  link: https://github.com/acids-ircam/RAVE
  notes: Source code is available, including data preparation, model architecture,
    training pipeline and inference.

# [2] Training data
trainingdata:
  class: closed
  link: ''
  notes: Training data is internal and just briefly described. 

# [3] Model weights
modelweights:
  class: open
  link: https://acids-ircam.github.io/rave_models_download
  notes: Several pretrained models are provided.

# [4] Code documentation
codedoc:
  class: open
  link: https://github.com/acids-ircam/RAVE/blob/master/README.md
  notes: Code is thoroughly documented, allowing for understanding and reproducibility
    of the model.

# [5] Training procedure
trainprocedure:
  class: open
  link: https://arxiv.org/pdf/2111.05011
  notes: Training procedure is described.

# [6] Evaluation procedure
evalprocedure:
  class: open
  link: https://arxiv.org/pdf/2111.05011
  notes: Evaluation procedure is described, and the implementations used for the evaluation metrics are referenced.

# [7] Research paper
paper:
  class: partial
  link: https://arxiv.org/abs/2111.05011
  notes: Preprint only. No peer-reviewed version.
  date:

# [8] Licensing
license:
  class: partial
  link: https://github.com/acids-ircam/RAVE/blob/master/LICENSE
  notes: System covered by a CC BY-NC 4.0 license.

# [9] Model Card
modelcard:
  class: star
  link: https://acids-ircam.github.io/rave_models_download
  notes: Model card is available. 

# [10] Datasheet
datasheet:
  class: ∅
  link: ''
  notes: Not available.

# [11] Package
package:
  class: star
  link: https://pypi.org/project/acids-rave/
  notes: Pip package is available.

# [12] User-oriented application
ux:
  class: star
  link: https://forum.ircam.fr/projects/detail/rave-vst/
  notes: Real-time implementation of the model and tutorials are provided.

# [13] Demo Page
suppage:
  class: star
  link: https://anonymous84654.github.io/RAVE_anonymous/
  notes: Demo page is available, showcasing the model's capabilities and providing sound examples of its use.