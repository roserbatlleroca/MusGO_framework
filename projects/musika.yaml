####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: text-to-music, lyric-to-song, audio-to-audio,
#   audio-continuation, timbre-transfer, midi-to-audio, other (please specify in notes)
# Suggested `architecture` values: diffusion, transformer, gan, vae, flow-matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: Musika
    link: https://github.com/marcoppasini/musika
    year: 2022
    license: MIT License. 
    description: A music generation system that can be trained on hundreds of hours of music using a single consumer GPU, and that allows for much faster than real-time generation of music of arbitrary length on a consumer CPU.      # 1-3 sentence summary of what the model does and how it works
    apptype: Audio synthesis  # specify the application type of the model (see suggestions above)
    architecture: GAN      # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
  name: Johannes Kepler University Linz
  link:
  notes:

# MusGO evaluation

# [1] Open Source Code
sourcecode:
  class: open
  link: https://github.com/marcoppasini/musika
  notes: Codebase is available and complete. 

# [2] Training data
trainingdata:
  class: partial
  link: 
  notes: Training data is described in the research paper. Some of the data used
    is publicly available (LibriTTS corpus). However, there are some sections of the
    used data that are not accessible or detailed enough to fully reconstruct the
    dataset (South by SouthWest). Also, music coming from http://jamendo.com under
    “techno” genre is not detailed. 

# [3] Model weights
modelweights:
  class: open
  link: https://huggingface.co/musika/musika_techno/tree/main
  notes: Weights are publicly available. 

# [4] Code documentation
codedoc:
  class: open
  link: https://github.com/marcoppasini/musika/blob/main/README.md
  notes: Codebase is documented, including details on environment and configuration
    settings. 

# [5] Training procedure
trainprocedure:
  class: open
  link: https://arxiv.org/pdf/2208.08706
  notes: Detailed in research paper and proper instructions are given in the model
    repository. 

# [6] Evaluation procedure
evalprocedure:
  class: partial
  link: https://arxiv.org/pdf/2208.08706
  notes: FAD is used for evaluation. However, there are details missing on the evaluation procedure. 

# [7] Research paper
paper:
  class: open
  link: https://ismir2022program.ismir.net/poster_74.html
  notes: Accepted at ISMIR 2022.
  date:

# [8] Licensing
license:
  class: open
  link: https://github.com/marcoppasini/musika/blob/main/LICENSE
  notes: MIT License. 

# [9] Model Card
modelcard:
  class: ∅
  link: 
  notes: Not available. 

# [10] Datasheet
datasheet:
  class: ∅
  link: 
  notes: Not available. 

# [11] Package
package:
  class: ∅
  link: 
  notes: Not available. Source code is provided through GitHub, but not as an installable
    packaged or with version control. 

# [12] User-oriented application
ux:
  class: star
  link: https://colab.research.google.com/drive/1PowSw3doBURwLE-OTCiWkO8HVbS5paRb
  notes: An interface is provided through Gradio. In addition, there is a colab notebook
    that intends to ease accessibility for non technical users. 

# [13] Demo Page
suppage:
  class: star
  link: https://marcoppasini.github.io/musika
  notes: Complementary page is available with sound examples and demonstration of the model's capabilities.