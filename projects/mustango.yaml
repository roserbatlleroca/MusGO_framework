---
####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: Mustango
    link: https://amaai-lab.github.io/mustango/
    year: 2024
    license: MIT License
    description: A music-domain-knowledge-inspired text-to-music latent diffusion model capable of fine-grained control over harmonic and rhythmic elements via an integrated MuNet architecture.      # 1-3 sentence summary of what the model does and how it works
    apptype:  Text-to-music         # specify the application type of the model (see suggestions above)
    architecture: Latent diffusion     # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org: 
    name: AMAAI Lab, Singapore University of Technology and Design and Queen Mary University of London
    link: https://amaai-lab.github.io/
    notes: 

# MusGO evaluation

# [1] System source code
sourcecode:
    class: open
    link: https://github.com/AMAAI-Lab/mustango
    notes: The codebase is complete and accessible on GitHub. The repository features model architecture, training pipeline, inference, and data processing. 

# [2] Training data
trainingdata:
    class: open
    link: https://huggingface.co/datasets/amaai-lab/MusicBench
    notes: Mustango is trained on the MusicBench dataset, which is a collection of ~52k 10-seconds music samples. These samples were generated through targeted harmonic, rhythmic, and dynamic data augmentations of the original MusicCaps dataset and enriched with automated music theory text descriptions.

# [3] Model weights
modelweights:
    class: open
    link: https://huggingface.co/declare-lab/mustango/tree/main/ldm
    notes: Model weights are available on HuggingFace. There is also a pretrained model available (https://huggingface.co/declare-lab/mustango-pretrained).

# [4] Code documentation 
codedoc:
    class: open
    link: https://github.com/AMAAI-Lab/mustango/blob/main/README.md
    notes: The codebase is properly documented, including instructions for installation, basic usage and model training. 

# [5] Training procedure
trainprocedure:
    class: open
    link: https://aclanthology.org/2024.naacl-long.459.pdf
    notes: Training procedure is well documented in the paper, including hardware requirements and model configurations (see Appendix B for further details). Additional implementation details are available in the GitHub repository.

# [6] Evaluation procedure
evalprocedure:
    class: open
    link: https://aclanthology.org/2024.naacl-long.459.pdf
    notes: Evaluation methodology is well documented in the paper, including evaluation metrics and model performance. Evaluation dataset is composed of TestA, TestB and FMACaps. TestA and TestB are the testing splits of MusicBench, which is based on MusicCaps (see Section 2.3). Further information about how FMACaps dataset was created is available in Appendix F. 

# [7] Research paper
paper:
    class: open
    link: https://aclanthology.org/2024.naacl-long.459.pdf
    notes: Accepted paper at NAACL 2024. 
    date: June, 2024

# [8] Licensing
license:
    class: open
    link: https://github.com/AMAAI-Lab/mustango?tab=MIT-1-ov-file
    notes: MIT License.

# [9] Model card
modelcard:
    class: star
    link: https://huggingface.co/declare-lab/mustango
    notes: A model card is available in HuggingFace. 

# [10] Datasheet
datasheet:
    class: star
    link: https://huggingface.co/datasets/amaai-lab/MusicBench/
    notes: There is a data card available for the MusicBench dataset on HuggingFace, which provides information about the dataset's composition, usage, and licensing.

# [11] Package
package:
    class: ∅
    link:
    notes:

# [12] User-oriented application
ux:
    class: star
    link: https://replicate.com/declare-lab/mustango
    notes: A demo is available on Replicate. There should also be a demo on HuggingFace Spaces, but it is currently not working (https://huggingface.co/spaces/declare-lab/mustango).

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://amaai-lab.github.io/mustango/
    notes: Complementary site with general model overview and sound examples is available. 
