# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# Notes should be provided for each category, explaining the classification and any relevant details.


project:
    name: DiffRhythm
    link: https://aslp-lab.github.io/DiffRhythm.github.io/
    license: Apache 2.0
    notes: "Note that there are two more recent versions of DiffRhythm: DiffRhythm+ and DiffRhythm 2." 
    year: 2025

org:
    name: ASLP@NPU and Shenzhen Research Institute of Big Data 
    link: http://www.npu-aslp.org/
    notes:

# [1] System source code
sourcecode:
    class: open
    link: https://github.com/ASLP-lab/DiffRhythm
    notes: Souce code is avaiable in the GitHub repo, including model architecture, inference, training and dataset processing. 

# [2] Training data
trainingdata:
    class: closed
    link: https://arxiv.org/pdf/2503.01183
    notes: Training data is not available nor properly described. In the research paper, they indicate that the model was trained on 60,000 hours of audio content, including English (60%), Chinese (30%) and instrumental (10%) songs (about 1 million songs). However, no information on specific data sources, acquisition methods, and data licensing is given. See "Dataset Setup" in Section 4.1. of the pre-print.

# [3] Model weights
modelweights:
    class: open
    link: https://huggingface.co/collections/ASLP-lab/diffrhythm
    notes: Model weights are avaiable in their HuggingFace page. Multiple versions of the model are avaiable. 

# [4] Code documentation 
codedoc:
    class: partial
    link: https://github.com/ASLP-lab/DiffRhythm/blob/main/Readme.md
    notes: Code documentation inclues instructions on how to install and inference the model, but there are no instuctions on how to train it (it is indicated at "coming soon"). 

# [5] Training procedure
trainprocedure:
    class: open
    link: https://arxiv.org/pdf/2503.01183
    notes: Training procedure is properly described in the research paper, including details on the models parameters and hardware requirements. 

# [6] Evaluation procedure
evalprocedure:
    class: partial
    link: https://arxiv.org/pdf/2503.01183
    notes: Evaluation procedure is described in the research paper, including metrics (see 4.3) and detailed results (see 5). However, evaluation data is not sufficently described nor avaiable to reproduce the evaluation. 

# [7] Research paper
paper:
    class: partial
    link: https://arxiv.org/pdf/2503.01183
    notes: "Research paper is available as preprint in arXiv. Also for more recent versions of the model: DiffRhythm+ and DiffRhythm 2. No peer reviewed version is avaiable for any of the papers."
    date: March 3, 2025

# [8] Licensing
license:
    class: open
    link: https://github.com/ASLP-lab/DiffRhythm?tab=Apache-2.0-1-ov-file
    notes: Apache 2.0 License 

# [9] Model card
modelcard:
    class: star
    link: https://huggingface.co/ASLP-lab/DiffRhythm-base
    notes: Model card available in Hugging Face.


# [10] Datasheet
datasheet:
    class: ∅
    link:
    notes:

# [11] Package
package:
    class: ∅
    link:
    notes:

# [12] User-oriented application
ux:
    class: star
    link: https://huggingface.co/spaces/ASLP-lab/DiffRhythm
    notes: A demo is available in HuggingFace. 

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://aslp-lab.github.io/DiffRhythm.github.io/
    notes: A supplementary page is available, including a brief description of the model, links to relevant sites (e.g., demo, paper) and some examples showcasing the model's abilities. 