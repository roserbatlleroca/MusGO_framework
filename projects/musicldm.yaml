####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: text-to-music, lyric-to-song, audio-to-audio,
#   audio-continuation, timbre-transfer, midi-to-audio, other (please specify in notes)
# Suggested `architecture` values: diffusion, transformer, gan, vae, flow-matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: MusicLDM
    link: https://github.com/RetroCirce/MusicLDM
    year: 2023
    license: Attribution-NonCommercial-ShareAlike 4.0 International
    description: A text-to-music generation model that is only trained on 10000 songs.       # 1-3 sentence summary of what the model does and how it works
    apptype: Text-to-music          # specify the application type of the model (see suggestions above)
    architecture: Latent diffusion, VAE, GAN     # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
  name: University of California San Diego, Mila-Quebec Artificial Intelligence Institute,University of Surrey, LAION
  link:
  notes:

# MusGO evaluation

# [1] Open Source Code
sourcecode:
  class: partial
  link: https://github.com/RetroCirce/MusicLDM
  notes: System source code is available at GitHub repository & Hugging Face Diffusers. 

# [2] Training data
trainingdata:
  class: partial
  link: 
  notes: MusicLDM is trained on the Audiostock dataset, which contains 9000 music
    tracks for training and 1000 tracks for testing. Dataset is not directly provided,
    no information about the original sources accessibility or requirements is provided. 

# [3] Model weights
modelweights:
  class: open
  link: https://drive.google.com/drive/folders/15VDVcIgf99YRM5oGXhRxa_Rowl54uWho
  notes: Model checkpoints are available. 
# [4] Code documentation
codedoc:
  class: open
  link: https://github.com/RetroCirce/MusicLDM/blob/main/README.md
  notes: Description on how to use the code is provided in the GitHub repo and through
    Hugging Face Diffusers.

# [5] Training procedure
trainprocedure:
  class: open
  link: https://arxiv.org/pdf/2308.01546
  notes: Training procedure is documented in the research article preprint and in
    the appendix additional page for the peer-reviewed version (https://musicldm.github.io/appendix/).
    Authors include specifications on hyperparameters, GPU requirements and model
    configurations. 

# [6] Evaluation procedure
evalprocedure:
  class: open
  link: https://arxiv.org/pdf/2308.01546
  notes: Evaluation procedure is described in the research paper. Evaluation code is available in the model’s 
    codebase and in its complementary repo (https://github.com/haoheliu/audioldm_eval). 

# [7] Research paper
paper:
  class: open
  link: https://ieeexplore.ieee.org/document/10447265
  notes: This article has been accepted at ICASSP 2024. The access of such paper
    is limited to IEEE Xplore access (https://ieeexplore.ieee.org/document/10447265).
    A preprint is available in arXiv (https://arxiv.org/pdf/2308.01546). 
  date:

# [8] Licensing
license:
  class: partial
  link: https://github.com/RetroCirce/MusicLDM/blob/main/LICENSE
  notes: Attribution-NonCommercial-ShareAlike 4.0 International

# [9] Model Card
modelcard:
  class: star
  link: https://huggingface.co/ucsd-reach/musicldm
  notes: Available at HuggingFace. 
    Information about model’s evaluation and limitations is missing and model’s architecture
    is just mentioned. 

# [10] Datasheet
datasheet:
  class: star
  link: https://github.com/LAION-AI/audio-dataset/blob/main/data_card/Audiostock.md
  notes: There is a data card. 
    However, content is limited to data sources origin and details on how to reproduce
    the data collection. Details on curation and other considerations, such as consent,
    limitations and selection strategies are missing. 

# [11] Package
package:
  class: ∅
  link: 
  notes: 

# [12] User-oriented application
ux:
  class: ∅
  link: 
  notes: API is shut down temporarily. Should be released again soon. 

# [13] Demo Page
suppage:
  class: star
  link: https://musicldm.github.io/
  notes: Demo page is available with sound examples and demonstration of the model's capabilities.
