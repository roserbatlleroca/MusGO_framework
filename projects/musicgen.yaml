---
####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: text-to-music, lyric-to-song, audio-to-audio,
#   audio-continuation, timbre-transfer, midi-to-audio, other (please specify in notes)
# Suggested `architecture` values: diffusion, transformer, gan, vae, flow-matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: MusicGen
    link: https://github.com/facebookresearch/audiocraft
    year: 2023
    license: MIT License 
    description: A simple and controllable music generation model, which is able to generate high-quality music given textual description. # 1-3 sentence summary of what the model does and how it works
    apptype: Text-to-music, Melody-to-music      # specify the application type of the model (see suggestions above)
    architecture: Autoregressive transformer     # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
  name: Meta AI
  link: https://www.meta.com/
  notes:

# MusGO evaluation

# [1] Open Source Code
sourcecode:
  class: open
  link: https://github.com/facebookresearch/audiocraft
  notes: Code is available. 

# [2] Training data
trainingdata:
  class: partial
  link: 
  notes: They describe the datasets used to training their model (licensed data). However, they rely on 10k music tracks that are not described
    (proprietary data). They do not provide any of the datasets used for training MusicGen. Only a dummy dataset containing just a few examples
    for illustrative purposes is provided.

# [3] Model weights
modelweights:
  class: open
  link: https://huggingface.co/facebook/musicgen-large/tree/main
  notes: Models are available in the GitHub repository and in Hugging Face. Note that the weights are released under the CC-BY-NC 4.0 license as found in the https://github.com/facebookresearch/audiocraft/blob/main/LICENSE_weights.

# [4] Code documentation
codedoc:
  class: open
  link: https://github.com/facebookresearch/audiocraft/blob/main/docs/MUSICGEN.md
  notes: Codebase is documented in the GitHub repository, including installation requirements. 

# [5] Training procedure
trainprocedure:
  class: open
  link: https://arxiv.org/pdf/2306.05284
  notes: Training procedure is well documented in the paper, including hardware requirements and model
    configurations. Additional implementation details are available in the GitHub repository.

# [6] Evaluation procedure
evalprocedure:
  class: open
  link: https://arxiv.org/pdf/2306.05284
  notes: Evaluation is documented in the paper and the code provides detailed explanation about the implementation of evaluation metrics. 
   Evaluating the model to reproduce the results still may require some effort. Dataset used for evaluation is MusicCaps benchmark.

# [7] Research paper
paper:
  class: open
  link: https://proceedings.neurips.cc/paper_files/paper/2023/hash/94b472a1842cd7c56dcb125fb2765fbd-Abstract-Conference.html
  notes: Accepted at NeurIPS 2023. 
  date:

# [8] Licensing
license:
  class: open
  link: https://github.com/facebookresearch/audiocraft/blob/main/LICENSE
  notes: The code in this repository is released under the MIT license as found in
    the https://github.com/facebookresearch/audiocraft/blob/main/LICENSE. The models
    weights in this repository are released under the CC-BY-NC 4.0 license as found
    in the https://github.com/facebookresearch/audiocraft/blob/main/LICENSE_weights.

# [9] Model Card
modelcard:
  class: star
  link: 
    https://github.com/facebookresearch/audiocraft/blob/main/model_cards/MUSICGEN_MODEL_CARD.md
  notes: Model card discusses intended use, limitations and biases. 
   
# [10] Datasheet
datasheet:
  class: ∅
  link: 
  notes: Data is copyrighted and not available.

# [11] Package
package:
  class: star
  link: https://pypi.org/project/audiocraft/
  notes: "Has two packages: audiocraft package from Meta, and transformers package from Hugging Face."

# [12] User-oriented application
ux:
  class: star
  link: https://huggingface.co/spaces/facebook/MusicGen
  notes: Demo in Hugging Face spaces, user-oriented gradio demo, and jupyter notebooks.

# [13] Demo Page
suppage:
  class: star
  link: https://ai.honu.io/papers/musicgen/
  notes: Supplementary material web page with sound examples. 
