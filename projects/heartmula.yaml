####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: HeartMuLa
    link: https://heartmula.github.io/
    year: 2026
    license: Apache License 2.0
    description: An LLM-based song generation model capable of synthesizing high-fidelity music under rich, user-controllable conditions. HeartMuLa supports multi-conditional music creation with inputs including textual style descriptions, lyrics, and reference audio.       # 1-3 sentence summary of what the model does and how it works
    apptype: Text-to-song, Lyrics-to-song, Style transfer     # specify the application type of the model (see suggestions above)
    architecture: Autoregressive transformer     # specify the architecture type of the model (see suggestions above)
    notes: Besides the HeartMuLa model, the repository also includes HeartCodec (a 12.5 Hz music codec), HeartTranscriptor (a whisper-based model for lyric transcription), and HeartCLAP (an audio-text aligment model for music descriptions and cross-modal retrieval). The current evaluation focuses only on the HeartMuLa model.            # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org: 
    name: HeartMuLa Teams
    link:
    notes:

# MusGO evaluation

# [1] System source code
sourcecode:
    class: partial
    link: https://github.com/HeartMuLa/heartlib
    notes: GitHub repository includes model architecture, and inference. But lacks specific code for traning or fine-tuning the model, and data processing. 

# [2] Training data
trainingdata:
    class: partial
    link: https://arxiv.org/pdf/2601.10547
    notes: Technical report indicates that HeartMuLa was trainied on ~100,000 hours of high-quality music and describes automated filtering pipelines. However, there is no information about the specific music used. 

# [3] Model weights
modelweights:
    class: open
    link: https://huggingface.co/HeartMuLa/HeartMuLa-oss-3B-happy-new-year/tree/main
    notes: Model weights are available on Hugging Face.

# [4] Code documentation 
codedoc:
    class: open
    link: https://github.com/HeartMuLa/heartlib?tab=readme-ov-file
    notes: All components of the codebase are properly documented in the GitHub repository, including installation requirements, examples of scripts usage and configuration files.

# [5] Training procedure
trainprocedure:
    class: open
    link: https://arxiv.org/pdf/2601.10547
    notes: Training procedure is well documented in the technical report, including hardware requirements and model configurations (see Section 2.2). 

# [6] Evaluation procedure
evalprocedure:
    class: open
    link: https://arxiv.org/pdf/2601.10547
    notes: The evaluation procedure is well documented in the technical report, including used metrics and test benchmacks. 

# [7] Research paper
paper:
    class: partial
    link: https://arxiv.org/pdf/2601.10547
    notes: A technical report is available on arXiv, but the paper is not yet peer-reviewed. The report provides a detailed description of the model architecture, training procedure, evaluation and inference.
    date: July 7, 2026

# [8] Licensing
license:
    class: open
    link: https://github.com/HeartMuLa/heartlib?tab=Apache-2.0-1-ov-file
    notes: Apache License 2.0. 

# [9] Model card
modelcard:
    class: star
    link: https://huggingface.co/HeartMuLa/HeartMuLa-oss-3B-happy-new-year 
    notes: Model card available in Hugging Face, although it could benefit from more detailed information about the model.

# [10] Datasheet
datasheet:
    class: ∅
    link:
    notes:

# [11] Package
package:
    class: ∅
    link:
    notes:

# [12] User-oriented application
ux:
    class: ∅
    link: https://huggingface.co/spaces/HeartMuLa/heartmula
    notes: According to the GitHub repository, there is a model demo available in Hugging Face Spaces and in Model Scope. However, neither of the two are currently operational. 

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://heartmula.github.io/
    notes: There is a complementary website for the HeartMuLa model, which includes multiple audible examples. 