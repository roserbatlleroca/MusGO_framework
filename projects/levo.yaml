####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: LeVo
    link: https://levo-demo.github.io/
    year: 2025
    license: Not available. 
    description: Full-song lyrics-to-music foundation model employing parallel token modeling (mixed semantic tokens and dual-track acoustic tokens) and multi-preference alignment.      # 1-3 sentence summary of what the model does and how it works
    apptype:  Lyrics-to-song, Text-to-music, Style transfer   # specify the application type of the model (see suggestions above)
    architecture: Autoregressive transformer      # specify the architecture type of the model (see suggestions above)
    notes: Sometimes, the model is referred to SongGeneration as well as LeVo. Source code has not yet been released, despite mentioning so in the research paper. Complementary website indicates "code will be released soon".            # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
    name: Tsinghua University, Shenzhen and Tencent AI Lab
    link: https://ailab.tencent.com/ailab/en/index/
    notes:

# MusGO evaluation

# [1] System source code
sourcecode:
    class: closed
    link: https://github.com/tencent-ailab/songgeneration
    notes: Source code is not currently accessible. 

# [2] Training data
trainingdata:
    class: partial
    link:
    notes: LeVo is trained on 2 million music tracks (~110,000 hours), including part of DISCO-10M, Millong Song Dataset and some copyrighted in-house data. No further information is provided, and the training data is not publicly available. 

# [3] Model weights
modelweights:
    class: closed
    link:
    notes:

# [4] Code documentation 
codedoc:
    class: closed
    link:
    notes:

# [5] Training procedure
trainprocedure:
    class: open
    link: https://openreview.net/pdf?id=Oul46PkP7Z
    notes: Training procedure is describes in the research paper, including hardware requirements and model hyperparameters (see Appendix B for further details). 

# [6] Evaluation procedure
evalprocedure:
    class: partial
    link: https://openreview.net/pdf?id=Oul46PkP7Z
    notes: Evaluation protocols are thoroughly detailed, including objective metrics and a 20-expert subjective evaluation (see Appendix D for futher details). However, dataset for evaluation is not fully specified nor publicly available.

# [7] Research paper
paper:
    class: open
    link: https://openreview.net/pdf?id=Oul46PkP7Z
    notes: Accepted at NeurIPS 2025. 
    date: June 2025
# [8] Licensing
license:
    class: closed
    link:
    notes:

# [9] Model card
modelcard:
    class: ∅
    link:
    notes:

# [10] Datasheet
datasheet:
    class: ∅
    link:
    notes:

# [11] Package
package:
    class: ∅
    link:
    notes:

# [12] User-oriented application
ux:
    class: ∅
    link:
    notes:

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://levo-demo.github.io/
    notes: An official project website is live and provides sonified audio demonstrations of generated music, zero-shot style transfer, and text-based control.
