license:
  class: closed
  link: 
  notes: Not available.

# [9] Model Card
modelcard:
  class: ∅
  link: 
  notes: No model card available.

# [10] Datasheet
datasheet:
  class: ∅
  link: 
  notes: No datasheet available.

# [11] Package
package:
  class: ∅
  link: 
  notes: No package available.

# [12] User-oriented application
ux:
  class: ∅
  link: 
  notes: No user interface nor real-time implementation available.

# [13] Demo Page
suppage:
