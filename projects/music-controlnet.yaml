  link: 
  notes: No model weights provided.

# [4] Code documentation
codedoc:
  class: closed
  link: 
  notes: No source code available so no documentation.

# [5] Training procedure
trainprocedure:
  class: open
  link: https://arxiv.org/pdf/2311.07069
  notes: Training procedure is described in detail in the paper.

# [6] Evaluation procedure
evalprocedure:
  class: partial
  link: https://arxiv.org/pdf/2311.07069
  notes: Evaluation procedure is described, but details on the specific 
    implementation used for some of the evaluation metrics are not given, limiting the reproducibility of results.

# [7] Research paper
paper:
  class: open
  link: https://dl.acm.org/doi/10.1109/TASLP.2024.3399026
  notes: Accepted at IEEE/ACM Transactions on Audio, Speech, and Languange Processing (open access). 
  date:

