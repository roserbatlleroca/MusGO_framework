####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# # If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: SongGen
    link: https://github.com/LiuZH-19/SongGen
    year: 2025
    license: Apache 2.0 License
    description: A single-stage auto-regressive transformer designed for controllable song generation.      # 1-3 sentence summary of what the model does and how it works
    apptype: Text-to-song, Lyric-to-song   # specify the application type of the model (see suggestions above)
    architecture: Autoregressive transformer  # specify the architecture type of the model (see suggestions above)
    notes:    # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
    name: Beihang University, Shanghai AI Laboratory, The Chinese University of Hong Kong, Harbin Institute of Technology, CPII (InnoHK)
    link: https://ev.buaa.edu.cn/
    notes:

# MusGO evaluation

# [1] System source code
sourcecode:
    class: open
    link: https://github.com/LiuZH-19/SongGen
    notes: The source code is available on GitHub, but there are some parts missing regarding data processing (indicated as to-do in GitHub). 

# [2] Training data
trainingdata:
    class: partial
    link:
    notes: This model is trained on 8,000 hours of openly licensed music data, including MSD, FMA and MTG-Jamendo. However, the curated version of the dataset is not available (indicated as to-do in GitHub).

# [3] Model weights
modelweights:
    class: open
    link: https://huggingface.co/LiuZH-19/SongGen_mixed_pro/tree/main
    notes: Weights are available on Hugging Face. 

# [4] Code documentation 
codedoc:
    class: open
    link: https://github.com/LiuZH-19/SongGen/blob/master/README.md
    notes: Codebase is well documented, with a README file that includes installation and inference instructions, and links to the training procedure. 

# [5] Training procedure
trainprocedure:
    class: open
    link: https://arxiv.org/pdf/2502.13128
    notes: The training procedure is described in the article (see Appendix A). Also, there are specific training guidelines in the GitHub repository.

# [6] Evaluation procedure
evalprocedure:
    class: open
    link: https://arxiv.org/pdf/2502.13128
    notes: Evaluation procedure is described in the article (see Appendix B). The dataset used for evaluation is available on Hugging Face.

# [7] Research paper
paper:
    class: open
    link: https://openreview.net/pdf?id=aTyQjpsaB4
    notes: Accepted at ICML 2025. 
    date: May 30, 2025

# [8] Licensing
license:
    class: open
    link: https://github.com/LiuZH-19/SongGen/tree/master?tab=Apache-2.0-1-ov-file
    notes: Apache License 2.0

# [9] Model card
modelcard:
    class: ∅
    link:
    notes:

# [10] Datasheet
datasheet:
    class: ∅
    link:
    notes:

# [11] Package
package:
    class: ∅
    link:
    notes:

# [12] User-oriented application
ux:
    class: ∅
    link:
    notes:

# [13] Supplementary Material Page
suppage:
    class: star
    link: https://liuzh-19.github.io/SongGen/
    notes: A demo page with sound examples is available. The page also includes a link to the GitHub repository and research paper. 


