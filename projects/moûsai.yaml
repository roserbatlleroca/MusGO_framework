####################################################################################################################################
# Project template of the MusGO framework repository (https://github.com/roserbatlleroca/MusGO-framework/). 
# Note that this document has been adapted from previous work by Andreas Liesenfeld, Alianda Lopez, and Mark Dingemanse. 
# For more details, check out: http://opening-up-chatgpt.github.io  
####################################################################################################################################

# Thank you for contributing!
# In filling out this yaml file, please follow the criteria as described here: 
# https://github.com/roserbatlleroca/MusGO-framework/tree/main/projects#criteria

# Remember to replace the template values with the actual information of the project you are evaluating.
# Essential categories [1-8] should be classified as either `open`, `partial`, or `closed`.
# Desirable categories [9-13] can be classified as `star` or `∅` (not applicable).
# For each category, `notes` should be used ONLY for complementary information about that
# category's evaluation (i.e., why it was classified the way it was). The overall project
# `description` field below is the place for a general summary of the model itself.

# `apptype` and `architecture` power the leaderboard's filter menus, so please use
# consistent, existing values whenever the model fits an established category
# (see the project folder for examples already in use). Add a new value only when
# none of the existing ones apply.
# # If a model fits more than one category, list them separated by commas
# (e.g. apptype: Text-to-music, Timber transfer). Each value will then be
# filterable independently on the leaderboard.
# Suggested `apptype` values: Text-to-music, Lyrics-to-song, Audio-to-audio,
# Audio continuation,, Timbre transfer, Style transfer, MIDI-to-audio, other (please specify in notes)
# Suggested `architecture` values: Diffusion, Transformer, GAN, VAE, Flow matching, 
# other (please specify in notes)

# Provide project main information 
# Please, do not remove any of the fields below, even if you do not have information for them.
project:
    name: Moûsai
    link: https://github.com/archinetai/audio-diffusion-pytorch
    year: 2023
    license: MIT license
    description: A cascading two-stage latent diffusion model that can generate multiple minutes of high-quality stereo music at 48kHz from textual descriptions.       # 1-3 sentence summary of what the model does and how it works
    apptype: Text-to-music    # specify the application type of the model (see suggestions above)
    architecture: Latent diffusion      # specify the architecture type of the model (see suggestions above)
    notes:             # complementary info about the project entry or evaluation (not category-specific)

# Provide information about the organization that developed the model
# Please, do not remove any of the fields below, even if you do not have information for them.
org:
  name: ETH Zürich, IIT Kharagpur, Max Planck Institute
  link:
  notes:

# MusGO evaluation

# [1] Open Source Code
sourcecode:
  class: partial
  link: https://github.com/archinetai/audio-diffusion-pytorch
  notes: They provide an audio diffusion library that includes different models. However,
    the configs shown are indicative and untested, see https://arxiv.org/abs/2301.11757 for
    the configs used in the paper.

# [2] Training data
trainingdata:
  class: partial
  link: ''
  notes: How the data is collected and acquired, including licensing issues, is detailed
    in the research paper. However, the exact list of songs in the dataset nor direct
    access to the dataset is available.

# [3] Model weights
modelweights:
  class: closed
  link: ''
  notes: In the GitHub repo, authors mention that “no pre-trained models are provided
    here”. 

# [4] Code documentation
codedoc:
  class: partial
  link: https://github.com/archinetai/audio-diffusion-pytorch/blob/main/README.md
  notes: Code is partially described as how to use Moûsai is not straightforward.

# [5] Training procedure
trainprocedure:
  class: open
  link: https://arxiv.org/pdf/2301.11757
  notes: Training procedure is describe in the article, including hardware requirements
    and model configuration. 

# [6] Evaluation procedure
evalprocedure:
  class: partial
  link: https://arxiv.org/pdf/2301.11757
  notes: Evaluation data or code for evaluation are not specified.

# [7] Research paper
paper:
  class: open
  link: https://aclanthology.org/2024.acl-long.437/
  notes: Accepted at ACL 2024.
  date:

# [8] Licensing
license:
  class: open
  link: https://github.com/archinetai/audio-diffusion-pytorch/blob/main/LICENSE
  notes: Code is under the MIT license. 

# [9] Model Card
modelcard:
  class: ∅
  link: ''
  notes: ''

# [10] Datasheet
datasheet:
  class: ∅
  link: ''
  notes: ''

# [11] Package
package:
  class: star
  link: https://pypi.org/project/audio-diffusion-pytorch/
  notes: Code belongs to https://github.com/archinetai/audio-diffusion-pytorch library.

# [12] User-oriented application
ux:
  class: ∅
  link: ''
  notes: ''

# [13] Demo Page
suppage:
  class: star
  link: https://diligent-pansy-4cb.notion.site/Music-Generation-with-Diffusion-ebe6e9e528984fa1b226d408f6002d87
